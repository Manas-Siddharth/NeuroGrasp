# NeuroGrasp Configuration File

data:
  data_dir: "data/sample_dataset"  # Path to dataset (or data/jacquard for full dataset)
  image_size: 224                  # Input RGB image resolution (H, W)
  train_split: 0.8                 # Train split ratio
  val_split: 0.2                   # Validation split ratio
  num_workers: 2                   # DataLoader workers

model:
  backbone: "resnet18"             # ResNet18 backbone
  pretrained: true                 # Use ImageNet pretrained weights
  dropout: 0.2                      # Dropout rate before linear heads

training:
  epochs: 25                       # Number of training epochs
  batch_size: 16                   # Batch size
  learning_rate: 0.001             # Initial learning rate
  weight_decay: 0.0001             # AdamW weight decay
  lr_scheduler: "cosine"           # Learning rate scheduler ("cosine", "step", "none")
  seed: 42                         # Random seed for reproducibility
  checkpoint_dir: "checkpoints"    # Directory to save model checkpoints
  best_model_name: "best_model.pth"

loss:
  lambda_xy: 1.0                   # Center position loss weight
  lambda_wh: 1.0                   # Grasp dimensions loss weight
  lambda_angle: 1.0                # Orientation sin/cos loss weight
  lambda_conf: 0.5                 # Grasp confidence loss weight

evaluation:
  iou_threshold: 0.25              # Grasp rectangle IoU threshold for success
  angle_threshold_deg: 30.0        # Angular error threshold in degrees for success
  results_dir: "results"           # Output directory for evaluation plots & metrics
